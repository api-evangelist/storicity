name: Storicity
description: Storicity Inc. was a Seoul, South Korea-based travel-technology startup, founded around 2020
  and backed by 500 Global, that built Yoda Trip (Korean brand "여다") — an AI-assisted consumer travel-planning
  mobile app offering customized itineraries and mobile audio guides for tourist destinations, shipped on iOS
  and Android. It was a consumer B2C mobile product rather than an API platform provider. An enrichment pass on
  2026-07-21 (web search plus a live domain/TLS probe) found no public API, developer portal, documentation,
  OpenAPI specification, SDK packages, GitHub organization, or other developer surface. Public records indicate
  the Yoda Trip service was discontinued in April 2025 and the company is listed as out of business; the
  yodatrip.com domain still resolves but serves a broken TLS certificate.
